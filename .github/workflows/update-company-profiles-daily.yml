name: Update company profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_company_profile.txt

      - name: Build profile site
        run: python company_profile_portal_v3.py

      - name: Commit generated data/site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company_profile_data company_profile_site
          git diff --cached --quiet || git commit -m "Update company profiles"
          git push
