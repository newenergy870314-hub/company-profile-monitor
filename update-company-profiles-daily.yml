name: Update Company Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements_company_profile.txt
      - name: Build company profile portal
        run: python company_profile_portal_v3.py
      - name: Commit generated profile site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html company_profile_data company_profile_site
          git diff --cached --quiet || git commit -m "Update company profiles"
          git push
