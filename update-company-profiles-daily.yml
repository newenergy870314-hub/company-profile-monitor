name: Update Company Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST

permissions:
  contents: write

concurrency:
  group: company-profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements_company_profile.txt

      - name: Build profile site
        run: python company_profile_portal_v3.py

      - name: Verify output
        run: |
          test -s index.html
          grep -q "PROFILE_DATA" index.html
          grep -q "modalBg" index.html
          grep -q "data-person" index.html

      - name: Commit generated site and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html company_profile_data company_profile_site
          git diff --cached --quiet || git commit -m "Update company profiles"
          git push
